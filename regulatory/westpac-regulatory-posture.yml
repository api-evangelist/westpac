    evidence:
    - source: https://www.westpac.com.au/privacy/privacy-statement/
      http_status: 200
      fetched: '2026-10-20'
      quote: "You can request access to the personal information (including your sensitive information and credit-related information) that we hold about you. You can also ask for corrections to be made to it. To do so, please contact us using the contact details provided below."
    note: >-
      The privacy statement names access and correction rights, made by contacting Westpac. The quoted section names

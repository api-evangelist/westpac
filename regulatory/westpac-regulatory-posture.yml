  data_residency:
    url: https://www.westpac.com.au/privacy/privacy-statement/
    section: '20. Sharing your personal information overseas'
    evidence:
    - source: https://www.westpac.com.au/privacy/privacy-statement/
      http_status: 200
      fetched: '2026-10-20'
      quote: "We may share your personal information (including your sensitive information) outside Australia to some of the types of recipients and for the purposes noted above, including:"
    - source: https://www.westpac.com.au/privacy/privacy-statement/
      http_status: 200
      fetched: '2026-10-20'
      quote: "Organisations operating overseas with whom we partner to provide goods and services to you and our contracted service providers operating overseas, which are likely to be located in New Zealand, United States, Canada, India, Japan, the Philippines, UK, Malaysia, Brazil, South Africa and the countries within the European Economic Area;"
    - source: https://www.westpac.com.au/content/dam/public/wbc/documents/pdf/aw/WBC_CDR_Policy.pdf
      http_status: 200
      fetched: '2026-10-20'
      quote: "Westpac Group will not disclose Third-Party CDR Data to accredited third parties who are located overseas or to a third party that is not accredited, other than our outsourced service provider."
    note: >-
      This is a disclosure of where data goes, not a residency commitment. General personal information may go to
      named overseas countries. Third-party CDR data is not disclosed overseas, except to the named outsourced
      provider, which is Australian-based.

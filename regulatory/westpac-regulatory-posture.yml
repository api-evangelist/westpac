  data_retention:
    url: https://www.westpac.com.au/content/dam/public/wbc/documents/pdf/aw/WBC_CDR_Policy.pdf
    section: 'What Happens When We No Longer Need Your Third-Party CDR Data'
    stated_period: 'deletion within 24 hours of consent withdrawal or expiry; backups up to 12 months (third-party CDR data only)'
    evidence:
    - source: https://www.westpac.com.au/content/dam/public/wbc/documents/pdf/aw/WBC_CDR_Policy.pdf
      http_status: 200
      fetched: '2026-10-20'
      quote: "Your data will be deleted from our systems within 24 hours of your withdrawal of consent or expiration of your consent, unless we’re legally required to keep it. A back-up of our database which contains your data will be retained for a maximum of 12 months, at which point it will be permanently deleted."
    note: >-
      This retention period covers only third-party CDR data that Westpac receives as an Accredited Data Recipient.

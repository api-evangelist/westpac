overlay: 1.0.0
info:
  title: API Evangelist enhancements for CDR Banking Banking Account Scheduled Payments API
  version: 1.0.0
extends: openapi/westpac-banking-account-scheduled-payments-api-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: westpac
    x-apievangelist-standard: cdr-consumer-data-standards
    x-apievangelist-auth: cdr-adr-consent-fapi-mtls
- target: $.servers
  update:
  - url: https://digital-api.westpac.com.au/cds-au/v1
    description: Westpac CDR data holder base URL (from the saved contract servers[])
- target: $.paths['/banking/accounts/{accountId}/payments/scheduled'].get
  update:
    x-apievangelist-tool: list_scheduled_payments
    x-apievangelist-agent-access: gated-read
- target: $.paths['/banking/payments/scheduled'].get
  update:
    x-apievangelist-tool: list_scheduled_payments_bulk
    x-apievangelist-agent-access: gated-read
- target: $.paths['/banking/payments/scheduled'].post
  update:
    x-apievangelist-tool: list_scheduled_payments_specific_accounts
    x-apievangelist-agent-access: gated-read
- target: $.paths['/banking/accounts/{accountId}/payments/plans'].get
  update:
    x-apievangelist-tool: list_instalment_plans
    x-apievangelist-agent-access: gated-read
- target: $.paths['/banking/accounts/payments/plans'].get
  update:
    x-apievangelist-tool: list_instalment_plans_bulk
    x-apievangelist-agent-access: gated-read
